name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake animation (light)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: manab-ghh
          outputs: dist/github-contribution-grid-snake.svg

      - name: Generate snake animation (dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: manab-ghh
          outputs: dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push snake SVGs to output branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: output
          folder: dist
          clean: false
          single-commit: true
          commit-message: "chore: update snake animation [skip ci]"
